# Tool settings only. The package is not installed; run everything from the project root.
[project]
name = "peekaboo"
version = "0.1.0"
description = "Controlled occlusion benchmark and analysis of PredNet: tracking through occlusion, reappearance, and surprise"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
