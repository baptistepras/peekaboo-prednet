# Pilot run of the main model (step 2.4) with the visible digit pixels weighted by 10 in the loss (decision D12): with
# PredNet's own loss, the first pilot never drew the digit (see the README, "Pilot results"). About 5 h 20 on an
# Apple M5 (1.8 s per step plus 21 validations of 35 s). Paths are relative to the project root.
name: pilot_prednet5l_w10
model: configs/models/prednet_5l.yaml
data: configs/data/base.yaml

train:
  steps: 10000         # 160,000 new sequences of the training mix
  batch_size: 16
  seq_len: 40          # whole sequences, as in the evaluation
  workers: 4
  seed: 0
  log_every: 100

optimizer:
  lr: 0.001            # Adam, as in Lotter et al.
  lr_drop_at: 0.5      # divided by 10 halfway, as in Lotter et al.
  lr_drop_factor: 0.1
  grad_clip: null

loss:
  digit_weight: 10     # visible digit pixels of the target frames count 10 times in the L1 loss

validation:
  data: val_v1
  every: 500           # 21 validations; last.pt is saved at each one
  sequences: null      # the whole set, 1000 sequences
  batch_size: 16
